<h1>Something went wrong</h1>
<p class="lead">We were {{ action }} when this happened. Nothing was changed.</p>

<ul class="checks">
  <li class="check is-bad">
    <span class="check-mark">✕</span>
    <span class="check-detail">{{ error_type }}: {{ error_message }}</span>
  </li>
</ul>

<p class="lead">Check the container's log for the full detail.</p>
